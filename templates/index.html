<!DOCTYPE html>
<html>
<head>
    <title>AI College Helpdesk</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }
select {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI College Helpdesk</h1>

    <form action="/predict" method="POST">

        <label>Student Name:</label>
        <input type="text" name="student_name"
               placeholder="Enter your name" required>

        <br><br>

        <label>Problem:</label>
        <textarea name="ticket" rows="6"
                  placeholder="Describe your problem here..."
                  required></textarea>
<br><br>

<label>Priority:</label>

<select name="priority" required>
    <option value="">Select Priority</option>
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
</select>

<br><br>
        <button type="submit">Classify Ticket</button>

    </form>

</div>

</body>
</html>
