<!DOCTYPE html>
<html>
<head>
    <title>AI College Helpdesk</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        label {
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background-color: #222;
            color: white;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI College Helpdesk</h1>

    <form action="/predict" method="POST">

        <!-- Student Name -->
        <label>Student Name:</label>
        <input type="text"
               name="student_name"
               placeholder="Enter your name"
               required>

        <br><br>

        <!-- Department -->
        <label>Department:</label>

        <select name="department" required>
            <option value="">Select Department</option>
            <option value="Information Technology">
                Information Technology
            </option>
            <option value="Computer Engineering">
                Computer Engineering
            </option>
            <option value="Electronics">
                Electronics
            </option>
            <option value="Mechanical">
                Mechanical
            </option>
            <option value="Civil">
                Civil
            </option>
        </select>

        <br><br>

        <!-- Problem -->
        <label>Problem:</label>
        <textarea name="ticket"
                  rows="6"
                  placeholder="Describe your problem here..."
                  required></textarea>

        <br><br>

        <!-- Priority -->
        <label>Priority:</label>

        <select name="priority" required>
            <option value="">Select Priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <br><br>

        <!-- Submit -->
        <button type="submit">
            Classify Ticket
        </button>

    </form>

</div>

</body>
</html>
